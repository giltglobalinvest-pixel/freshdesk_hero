<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Freshdesk Hero">
<title>Freshdesk Hero</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;}
body{display:flex;align-items:center;justify-content:center;background:#0d0d0d;color:#fff;}
.loader{text-align:center;padding:30px;max-width:420px;width:100%;}
.icon{font-size:64px;margin-bottom:18px;}
.title{font-size:22px;font-weight:700;margin-bottom:6px;}
.sub{font-size:13px;color:#888;margin-bottom:24px;}
.spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#00e676;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.status{font-family:monospace;font-size:11px;color:#666;}
.err{color:#ff5252;background:#2a1010;padding:12px 16px;border-radius:8px;border:1px solid #5a2020;margin-top:12px;font-size:12px;text-align:left;line-height:1.5;}
.btn{display:inline-block;margin:8px 4px 0;padding:10px 20px;background:#00e676;color:#0d0d0d;border:none;border-radius:8px;font-weight:700;cursor:pointer;text-decoration:none;font-size:13px;font-family:inherit;}
.btn.gray{background:#888;color:#fff;}
</style>
</head>
<body>
<div class="loader" id="loader">
<div class="icon">🚀</div>
<div class="title">Freshdesk Hero</div>
<div class="sub">Lade neueste Version...</div>
<div class="spinner"></div>
<div class="status" id="status">Verbinde...</div>
</div>
<script>
(async function(){
var REPO='giltglobalinvest-pixel/freshdesk_hero';
var FILENAME='index.html';
var POLL_MIN=5;
var loaderEl=document.getElementById('loader');
var statusEl=document.getElementById('status');
function setStatus(msg){if(statusEl&&statusEl.parentNode)statusEl.textContent=msg;}
function escHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function showError(msg,hint,allowCached){
var html='<div class="err">'+escHtml(msg)+(hint?'<br><br><strong>Tipp:</strong> '+escHtml(hint):'')+'</div>';
html+='<button class="btn" onclick="location.reload()">Erneut versuchen</button>';
if(allowCached&&window._cachedApp)html+='<button class="btn gray" onclick="loadCached()">Gecachte Version starten</button>';
loaderEl.innerHTML=html;
}
window.loadCached=function(){if(window._cachedApp){document.open();document.write(window._cachedApp);document.close();}};
var cacheKey='app_cache_'+REPO;
var shaKey=cacheKey+'_sha';
var CACHE_NAME='fdh-app-v1';
var cachedHtml=null,cachedAt=null,cachedSha=null;
try{cachedAt=localStorage.getItem(cacheKey+'_at');cachedSha=localStorage.getItem(shaKey);}catch(e){}

/* Der Anwendungsquelltext ist mehrere Megabyte gross. Er gehoert nicht in den
   localStorage: Dort teilen sich ALLE Apps derselben Domain rund 5 MB, und ein
   3-MB-Eintrag sprengt das Budget fuer jede andere. Die Cache-Storage-API ist
   genau dafuer da und kennt diese Grenze nicht. Faellt sie aus, wird geladen
   wie bisher. */
async function cacheLesen(){
  try{
    if(!window.caches)return null;
    var c=await caches.open(CACHE_NAME);
    var r=await c.match('app');
    return r?await r.text():null;
  }catch(e){return null;}
}
async function cacheSchreiben(html,sha){
  try{
    if(!window.caches)return;
    var c=await caches.open(CACHE_NAME);
    await c.put('app',new Response(html,{headers:{'Content-Type':'text/html; charset=utf-8'}}));
    try{localStorage.setItem(cacheKey+'_at',new Date().toISOString());localStorage.setItem(shaKey,sha||'');}catch(e){}
    /* Altlast aus der localStorage-Zeit wegraeumen — sie blockiert sonst
       dauerhaft Platz, den andere Apps derselben Domain brauchen. */
    try{localStorage.removeItem(cacheKey);}catch(e){}
  }catch(e){}
}
async function shaHolen(){
  var c=new AbortController();
  var t=setTimeout(function(){c.abort();},4000);   // haengt die API, wird geladen wie bisher
  try{
    var r=await fetch('https://api.github.com/repos/'+REPO+'/commits?path='+FILENAME+'&per_page=1',{signal:c.signal});
    if(!r.ok)return null;
    var d=await r.json();
    return (d&&d[0]&&d[0].sha)||null;
  }catch(e){return null;}finally{clearTimeout(t);}
}
function starten(html){
  setStatus('Starte App');
  var fertig=injectMonitor(html);
  setTimeout(function(){document.open();document.write(fertig);document.close();},60);
}

try{
/* Schneller Weg: Erst fragen, OB sich etwas geaendert hat (ein knappes
   Kilobyte), statt jedes Mal blind die ganze Datei zu ziehen. Unveraendert
   und im Cache? Dann sofort starten. Genau das hat auf dem Handy bei jedem
   Start mehrere Megabyte gekostet. */
setStatus('Pruefe Version');
var sha=await shaHolen();
if(sha&&cachedSha&&sha===cachedSha){
  var ausCache=await cacheLesen();
  if(ausCache&&ausCache.length>100){
    try{localStorage.setItem(cacheKey+'_seen_sha',sha);}catch(e){}
    window._cachedApp=ausCache;
    setStatus('Aus dem Zwischenspeicher');
    starten(ausCache);
    return;
  }
}

setStatus('Lade neueste Version');
var url='https://raw.githubusercontent.com/'+REPO+'/main/'+FILENAME+'?t='+Date.now();
var res=await fetch(url,{cache:'no-store'});
if(!res.ok)throw new Error('HTTP '+res.status);
var html=await res.text();
if(!html||html.length<100)throw new Error('Datei leer oder ungueltig');
window._cachedApp=html;
await cacheSchreiben(html,sha);
try{if(sha)localStorage.setItem(cacheKey+'_seen_sha',sha);}catch(e){}
starten(html);
}catch(err){
console.error('Loader error:',err);
cachedHtml=await cacheLesen();
if(cachedHtml)window._cachedApp=cachedHtml;
if(cachedHtml){
setStatus('Offline-Modus');
var d=cachedAt?new Date(cachedAt).toLocaleString('de-DE'):'unbekannt';
var b='<div style="position:fixed;top:0;left:0;right:0;background:#ff9800;color:#000;padding:8px;text-align:center;font-family:sans-serif;font-size:12px;z-index:99999;padding-top:calc(8px + env(safe-area-inset-top, 0px))">Offline-Modus · Letzte Version vom '+escHtml(d)+' · <a href="javascript:location.reload()" style="color:#000;font-weight:700;">Erneut verbinden</a></div>';
var withBanner=cachedHtml.replace(/<body([^>]*)>/i,'<body$1>'+b);
setTimeout(function(){document.open();document.write(injectMonitor(withBanner));document.close();},200);
}else{
showError('Konnte App nicht laden: '+err.message,'Prüfe deine Internetverbindung.',true);
}
}
})();
</script>
</body>
</html>
